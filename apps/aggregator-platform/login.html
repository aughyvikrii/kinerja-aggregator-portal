<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - SolusiSDM Aggregator Platform</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                        },
                        colors: {
                            zinc: {
                                50: "#fafafa",
                                100: "#f4f4f5",
                                200: "#e4e4e7",
                                300: "#d4d4d8",
                                400: "#a1a1aa",
                                500: "#71717a",
                                600: "#52525b",
                                700: "#3f3f46",
                                800: "#27272a",
                                900: "#18181b",
                            },
                        },
                    },
                },
            };
        </script>
    </head>
    <body
        class="bg-zinc-50 min-h-screen flex items-center justify-center p-4"
        x-data="{ role: 'partner' }"
    >
        <div class="w-full max-w-md">
            <!-- Logo & Header -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 bg-zinc-900 rounded-xl mb-4"
                >
                    <i data-lucide="hexagon" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-2xl font-semibold text-zinc-900">
                    SolusiSDM Platform
                </h1>
                <p class="text-zinc-500 mt-1">Sign in to your account</p>
            </div>

            <!-- Login Card -->
            <div
                class="bg-white rounded-2xl shadow-sm border border-zinc-200 p-8"
            >
                <!-- Role Selection -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-zinc-700 mb-2"
                        >Sign in as</label
                    >
                    <div
                        class="grid grid-cols-3 gap-2 p-1 bg-zinc-100 rounded-lg"
                    >
                        <button
                            @click="role = 'partner'"
                            :class="role === 'partner' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-700'"
                            class="px-3 py-2 text-sm font-medium rounded-md transition-all"
                        >
                            Partner
                        </button>
                        <button
                            @click="role = 'admin'"
                            :class="role === 'admin' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-700'"
                            class="px-3 py-2 text-sm font-medium rounded-md transition-all"
                        >
                            Admin
                        </button>
                        <button
                            @click="role = 'company'"
                            :class="role === 'company' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-700'"
                            class="px-3 py-2 text-sm font-medium rounded-md transition-all"
                        >
                            Company
                        </button>
                    </div>
                </div>

                <!-- Login Form -->
                <form
                    class="space-y-5"
                    onsubmit="
                        event.preventDefault();
                        handleLogin(role);
                    "
                >
                    <div>
                        <label
                            class="block text-sm font-medium text-zinc-700 mb-1.5"
                            >Email</label
                        >
                        <div class="relative">
                            <i
                                data-lucide="mail"
                                class="w-5 h-5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"
                            ></i>
                            <input
                                type="email"
                                placeholder="name@company.com"
                                class="w-full pl-10 pr-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-900 transition-all"
                            />
                        </div>
                    </div>

                    <div>
                        <label
                            class="block text-sm font-medium text-zinc-700 mb-1.5"
                            >Password</label
                        >
                        <div class="relative">
                            <i
                                data-lucide="lock"
                                class="w-5 h-5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"
                            ></i>
                            <input
                                type="password"
                                placeholder="Enter your password"
                                class="w-full pl-10 pr-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-lg text-zinc-900 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-900 transition-all"
                            />
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="checkbox"
                                class="w-4 h-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900"
                            />
                            <span class="text-sm text-zinc-600"
                                >Remember me</span
                            >
                        </label>
                        <a
                            href="#"
                            class="text-sm font-medium text-zinc-900 hover:underline"
                            >Forgot password?</a
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full py-2.5 bg-zinc-900 text-white font-medium rounded-lg hover:bg-zinc-800 transition-colors"
                    >
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-zinc-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-zinc-500"
                            >New partner?</span
                        >
                    </div>
                </div>

                <a
                    href="register-partner.html"
                    class="flex items-center justify-center gap-2 w-full py-2.5 border border-zinc-200 text-zinc-700 font-medium rounded-lg hover:bg-zinc-50 transition-colors"
                >
                    <i data-lucide="building-2" class="w-4 h-4"></i>
                    Register as Partner
                </a>
            </div>

            <!-- Footer -->
            <p class="text-center text-sm text-zinc-400 mt-6">
                &copy; 2024 SolusiSDM. All rights reserved.
            </p>
        </div>

        <script>
            lucide.createIcons();

            function handleLogin(role) {
                const redirectMap = {
                    partner: "partner/dashboard.html",
                    admin: "admin/dashboard.html",
                    company: "company/dashboard.html",
                };
                window.location.href =
                    redirectMap[role] || "partner/dashboard.html";
            }
        </script>
    </body>
</html>
